{% extends 'housekeeping/mobile/base_hk.html' %}
{% block title %}Request Stock{% endblock %}
{% block hdr_title %}REQUISITION{% endblock %}
{% block back_btn %}<a href="/housekeeping/stock/" class="bk">←</a>{% endblock %}

{% block content %}
<div class="card">
  <form method="post" action="/housekeeping/stock/request/">
    {% csrf_token %}
    <div class="fg"><label>Requester</label><input type="text" value="{{ request.user.get_full_name|default:request.user.username }}" disabled style="background:#f3f4f6;color:#6b7280"></div>
    <div class="fg">
      <label>Select from Inventory (optional)</label>
      <select name="inventory_item_id" id="inv_sel" onchange="fillItem(this)">
        <option value="">— Choose existing item —</option>
        {% for item in inv_items %}<option value="{{ item.id }}" data-name="{{ item.name }}" data-unit="{{ item.get_unit_display }}">{% if item.item_code %}[{{ item.item_code }}] {% endif %}{{ item.name }} ({{ item.available_quantity }} {{ item.get_unit_display }})</option>{% endfor %}
      </select>
    </div>
    <div class="fg"><label>Required Item *</label><input type="text" name="item_name" id="iname" required placeholder="Item name" value="{{ pre_item }}"></div>
    <div class="fg">
      <label>Quantity</label>
      <div style="display:flex;gap:10px;align-items:center">
        <button type="button" onclick="chg(-1)" style="width:44px;height:44px;border-radius:8px;border:1.5px solid #d1d5db;background:#fff;font-size:22px;cursor:pointer;flex-shrink:0">−</button>
        <input type="number" name="quantity" id="qty" value="1" min="1" style="text-align:center;font-size:20px;font-weight:700;flex:1">
        <button type="button" onclick="chg(1)" style="width:44px;height:44px;border-radius:8px;border:1.5px solid #d1d5db;background:#fff;font-size:22px;cursor:pointer;flex-shrink:0">+</button>
      </div>
    </div>
    <div class="fg"><label>Unit</label><input type="text" name="unit" id="unit" placeholder="e.g. bottles, kg, rolls, pieces"></div>
    {% if user_areas.count > 1 %}
    <div class="fg"><label>For Area</label>
      <select name="area_id">{% for a in user_areas %}<option value="{{ a.id }}" {% if selected_area.id == a.id %}selected{% endif %}>{{ a.name }}</option>{% endfor %}</select>
    </div>
    {% elif user_areas %}<input type="hidden" name="area_id" value="{{ user_areas.first.id }}">{% endif %}
    <div class="fg"><label>Reason *</label><textarea name="reason" rows="3" required placeholder="Why is this needed? For which task?"></textarea></div>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-weight:400;font-size:14px;cursor:pointer">
      <input type="checkbox" name="is_urgent" style="width:18px;height:18px"> ⚡ Mark as Urgent
    </label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button type="submit" class="btn-s">📋 Submit Request</button>
      <a href="/housekeeping/stock/" style="display:block"><button type="button" class="btn-g">← Cancel</button></a>
    </div>
  </form>
</div>
<script>
function chg(d){const i=document.getElementById('qty');i.value=Math.max(1,parseInt(i.value)+d);}
function fillItem(s){const o=s.options[s.selectedIndex];if(o.value){document.getElementById('iname').value=o.dataset.name||'';document.getElementById('unit').value=o.dataset.unit||'';}}
</script>
{% endblock %}
