<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white rounded-xl shadow p-6">
        <h1 class="text-xl font-bold text-slate-900 mb-1">Campus Inventory</h1>
        <p class="text-sm text-slate-500 mb-5">Mobile Login</p>

        {% if error %}
            <div class="mb-4 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm px-3 py-2">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="{% url 'mobile_login' %}" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input
                    type="text"
                    name="username"
                    required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input
                    type="password"
                    name="password"
                    required
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium rounded-lg px-4 py-2.5"
            >
                Login
            </button>
        </form>
    </div>
</body>
</html>
