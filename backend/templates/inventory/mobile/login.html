<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Inventory &mdash; Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(160deg, #1a3a2e 0%, #2d4a3e 60%, #3a5e50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 360px;
            background: white;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo {
            width: 56px; height: 56px;
            background: #2d4a3e;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
        }
        .login-logo .material-icons-round { color: white; font-size: 28px; }
        .login-title { font-size: 22px; font-weight: 800; color: #1a1a1a; margin-bottom: 4px; }
        .login-sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group { margin-bottom: 16px; }
        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
        }
        .form-input {
            width: 100%;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 12px 12px 38px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-input:focus { border-color: #2d4a3e; }
        .btn-login {
            width: 100%;
            height: 48px;
            background: #2d4a3e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: filter 0.15s;
            margin-top: 8px;
        }
        .btn-login:active { filter: brightness(0.9); }
        .error-box {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 10px;
            padding: 10px 12px;
            color: #991b1b;
            font-size: 13px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <span class="material-icons-round">inventory_2</span>
        </div>
        <div class="login-title">Campus Inventory</div>
        <div class="login-sub">Sign in to your account</div>

        {% if error %}
        <div class="error-box">
            <span class="material-icons-round" style="font-size:16px;flex-shrink:0">error_outline</span>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{% url 'mobile_login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="material-icons-round input-icon">person</span>
                    <input type="text" name="username" required autofocus
                        class="form-input" placeholder="Enter your username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="material-icons-round input-icon">lock</span>
                    <input type="password" name="password" required
                        class="form-input" placeholder="Enter your password">
                </div>
            </div>

            <button type="submit" class="btn-login">
                <span class="material-icons-round" style="font-size:18px">login</span>
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
