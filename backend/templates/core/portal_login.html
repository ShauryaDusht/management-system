<!DOCTYPE html>
<html lang="en">
<head>
{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="{% static 'branding/campus-sanchalika-logo.png' %}">
<title>Staff Portal Login | Campus Sanchalika</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(160deg,#1e3a30,#2d4a3e 40%,#3d6b55 70%,#c2622a 130%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.card{width:100%;max-width:380px;background:rgba(255,255,255,.96);border-radius:20px;padding:32px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{width:86px;height:86px;border-radius:24px;background:rgba(255,255,255,.98);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 14px 30px rgba(12,25,21,.18);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{color:#6b7280;font-size:12px;text-align:center;margin-bottom:22px}
.fg{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
input{width:100%;border:1.5px solid #d1d5db;border-radius:10px;padding:13px 13px;font-size:15px;outline:none;background:#fafafa;transition:border-color .2s}
input:focus{border-color:#2d4a3e;background:#fff}
.btn{width:100%;background:linear-gradient(135deg,#2d4a3e,#1e3a30);color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.err{background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:10px 12px;color:#991b1b;font-size:13px;margin-bottom:14px}
.hint{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;margin-top:14px;font-size:12px;color:#166534}
.foot{color:rgba(255,255,255,.75);font-size:12px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="{% static 'branding/campus-sanchalika-logo.png' %}" alt="Campus Sanchalika"></div>
  <h1>Campus Sanchalika</h1>
  <p class="sub">Unified Staff Portal Login</p>
  {% if error %}<div class="err">Error: {{ error }}</div>{% endif %}
  <form method="post" action="/portal/login/">
    {% csrf_token %}
    <div class="fg">
      <label>Username</label>
      <input type="text" name="username" required autofocus autocomplete="username">
    </div>
    <div class="fg">
      <label>Password</label>
      <input type="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn" type="submit">Login</button>
  </form>
  <div class="hint">Redirect is automatic based on your role after login.</div>
</div>
<p class="foot">Campus Sanchalika - IIT Gandhinagar</p>
</body>
</html>
