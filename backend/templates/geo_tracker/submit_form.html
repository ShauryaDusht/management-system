<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="/campus-sanchalika-logo.png">
<title>Plant Record | Campus Sanchalika</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a3a2a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#edeae4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;color:#1f2937;padding-bottom:40px}
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a3a2a,#0f2a1a);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.brand-logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.95);padding:2px;box-shadow:0 4px 12px rgba(0,0,0,.18);flex-shrink:0}
.hdr-copy{display:flex;flex-direction:column;gap:2px}
.hdr-app{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.hdr-ttl{font-weight:700;font-size:14px}
.page{padding:14px 12px;max-width:520px;margin:0 auto}
.card{background:rgba(255,255,255,.95);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.sec-title{font-size:12px;font-weight:800;color:#1a3a2a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-title::before{content:'';width:3px;height:14px;background:#1a3a2a;border-radius:2px;flex-shrink:0}
.fg{margin-bottom:12px}
.fg:last-child{margin-bottom:0}
label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
.required::after{content:' *';color:#dc2626}
input:not([type=radio]):not([type=checkbox]):not([type=file]),
select,textarea{
  width:100%;border:1.5px solid #d1d5db;border-radius:9px;padding:11px 13px;
  font-size:15px;outline:none;background:#fff;color:#111827;
  -webkit-appearance:none;appearance:none
}
input:focus,select:focus,textarea:focus{border-color:#1a3a2a;box-shadow:0 0 0 3px rgba(26,58,42,.09)}
input[type=file]{padding:10px;font-size:13px}
textarea{resize:vertical;min-height:80px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.type-opt input{display:none}
.type-label{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 6px;border-radius:11px;border:2px solid #e5e7eb;
  background:#f9fafb;font-size:12px;font-weight:800;color:#4b5563;cursor:pointer;
  transition:all .15s
}
.type-emoji{font-size:22px;line-height:1}
.type-opt input:checked + .type-label.tree{background:#dcfce7;border-color:#16a34a;color:#166534}
.type-opt input:checked + .type-label.plant{background:#ede9fe;border-color:#7c3aed;color:#5b21b6}
.type-opt input:checked + .type-label.creeper{background:#e0f2fe;border-color:#0284c7;color:#075985}
@media(max-width:420px){.type-grid{grid-template-columns:repeat(2,1fr)}}

/* ── GPS row ── */
.gps-row{display:flex;gap:8px;align-items:flex-end}
.gps-row .fg{flex:1;margin-bottom:0}
.btn-group{display:flex;gap:6px;flex-shrink:0}
.gps-btn,.map-btn{
  padding:11px 13px;border-radius:9px;border:none;
  font-size:13px;font-weight:700;cursor:pointer;
  white-space:nowrap;display:flex;align-items:center;gap:5px
}
.gps-btn{background:#1a3a2a;color:#fff}
.map-btn{background:#0e6b94;color:#fff}
.gps-btn:active,.map-btn:active{opacity:.85}
.gps-btn:disabled,.map-btn:disabled{opacity:.55;cursor:not-allowed}
.gps-status{font-size:11px;font-weight:600;margin-top:4px;min-height:16px}
.gps-status.ok{color:#16a34a}
.gps-status.err{color:#dc2626}
.gps-status.warn{color:#d97706}

/* Accuracy bar */
.acc-bar-wrap{margin-top:8px;display:none}
.acc-bar-label{font-size:11px;font-weight:700;color:#374151;margin-bottom:4px;display:flex;justify-content:space-between}
.acc-bar-track{height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.acc-bar-fill{height:100%;border-radius:4px;transition:width .4s,background .4s;width:0%}
.acc-bar-fill.poor{background:#ef4444}
.acc-bar-fill.ok{background:#f59e0b}
.acc-bar-fill.great{background:#16a34a}
.acc-bar-fill.map{background:#0e6b94}
.acc-samples{font-size:10px;color:#6b7280;margin-top:3px}
.acc-badge{
  display:inline-block;margin-top:3px;padding:2px 7px;border-radius:20px;
  font-size:10px;font-weight:800;display:none
}
.acc-badge.poor{background:#fee2e2;color:#991b1b}
.acc-badge.ok{background:#fef3c7;color:#92400e}
.acc-badge.great{background:#dcfce7;color:#166534}
.acc-badge.map{background:#e0f2fe;color:#075985}

/* ── Map picker ── */
.map-picker{display:none;margin-top:12px;border-radius:12px;overflow:hidden;border:2px solid #0e6b94;position:relative}
.map-picker.open{display:block}
#pinMap{width:100%;height:280px}
.map-instructions{
  background:#0e6b94;color:#fff;
  font-size:11px;font-weight:700;
  padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px
}
.map-instructions span{flex:1}
.map-confirm-btn{
  background:#fff;color:#0e6b94;border:none;
  border-radius:7px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer
}
.map-confirm-btn:active{opacity:.8}
/* crosshair overlay — sits on top of map, pointer-events:none so map still works */
.map-crosshair{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:32px;height:32px;pointer-events:none;z-index:1000
}
.map-crosshair::before,.map-crosshair::after{
  content:'';position:absolute;background:#dc2626
}
.map-crosshair::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
.map-crosshair::after{height:2px;width:100%;top:50%;transform:translateY(-50%)}
.map-crosshair-dot{
  position:absolute;top:50%;left:50%;
  width:6px;height:6px;background:#dc2626;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;z-index:1001
}
/* campus boundary indicator */
.campus-note{font-size:10px;color:#6b7280;margin-top:4px;text-align:center}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.submit-btn{
  width:100%;padding:15px;border-radius:12px;
  background:linear-gradient(135deg,#1a3a2a,#2d5a3a);
  color:#fff;border:none;font-size:16px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(26,58,42,.35);transition:opacity .15s
}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.flash{border-radius:12px;padding:13px 15px;margin-bottom:14px;font-weight:700;font-size:14px;text-align:center}
.flash.ok{background:#dcfce7;border:1px solid #86efac;color:#166534}
.flash.err{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:9px;margin-top:8px;display:none}
select option[disabled]{color:#9ca3af}
</style>
</head>
<body>

<div class="hdr">
  <img class="brand-logo" src="/campus-sanchalika-logo.png" alt="Campus Sanchalika">
  <div class="hdr-copy">
    <span class="hdr-app">Campus Sanchalika</span>
    <span class="hdr-ttl">🌿 Plant Record Submission</span>
  </div>
</div>

<div class="page">
  <div id="flash-area"></div>

  <form id="plantForm" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Plant Type (hidden, set by variety select) -->
    <div class="card">
      <div class="sec-title">Plant Type</div>
      <div class="type-grid">
        <label class="type-opt">
          <input type="radio" name="plant_type_display" value="tree">
          <span class="type-label tree"><span class="type-emoji">🌳</span>Tree</span>
        </label>
        <label class="type-opt">
          <input type="radio" name="plant_type_display" value="plant">
          <span class="type-label plant"><span class="type-emoji">🌿</span>Plant</span>
        </label>
        <label class="type-opt">
          <input type="radio" name="plant_type_display" value="creeper">
          <span class="type-label creeper"><span class="type-emoji">🌱</span>Creeper</span>
        </label>
      </div>
    </div>

    <!-- Identification -->
    <div class="card">
      <div class="sec-title">Identification</div>
      <div class="fg">
        <label class="required" for="variety">Local / Gujarati Name</label>
        <select id="variety" name="variety" required>
          <option value="" disabled selected>Select local name...</option>
          {% for v in varieties %}
          <option value="{{ v.id }}" data-type="{{ v.plant_type }}" data-name="{{ v.name }}" data-scientific="{{ v.scientific_name }}">{{ v.name }} ({{ v.get_plant_type_display }})</option>
          {% endfor %}
        </select>
        <input type="hidden" id="plant_type" name="plant_type">
        <input type="hidden" id="local_name" name="local_name">
        <input type="hidden" id="gps_accuracy_m" name="gps_accuracy_m">
      </div>
      <div class="fg">
        <label for="scientific_name">Botanical Name</label>
        <input type="text" id="scientific_name" name="scientific_name" readonly placeholder="Select local name first">
      </div>
    </div>

    <!-- Location -->
    <div class="card">
      <div class="sec-title">Location</div>
      <div class="gps-row">
        <div class="fg">
          <label class="required" for="latitude">Latitude</label>
          <input type="number" id="latitude" name="latitude" step="0.0000001" required readonly placeholder="Use GPS or Map">
        </div>
        <div class="fg">
          <label class="required" for="longitude">Longitude</label>
          <input type="number" id="longitude" name="longitude" step="0.0000001" required readonly placeholder="Use GPS or Map">
        </div>
        <div class="btn-group">
          <button type="button" class="gps-btn" id="gpsBtn" title="Auto-detect location">📍 GPS</button>
          <button type="button" class="map-btn" id="mapBtn" title="Place pin on campus map">🗺 Map</button>
        </div>
      </div>
      <div class="gps-status" id="gpsStatus"></div>
      <span class="acc-badge" id="accBadge"></span>
      <div class="acc-bar-wrap" id="accBarWrap">
        <div class="acc-bar-label">
          <span id="accBarLabel">Accuracy</span>
          <span id="accBarText">–</span>
        </div>
        <div class="acc-bar-track"><div class="acc-bar-fill" id="accBarFill"></div></div>
        <div class="acc-samples" id="accSamples"></div>
      </div>

      <!-- Map picker — hidden until Map button tapped -->
      <div class="map-picker" id="mapPicker">
        <div class="map-instructions">
          <span>Pan &amp; zoom to the tree, then tap Confirm</span>
          <button type="button" class="map-confirm-btn" id="mapConfirmBtn">✓ Confirm pin</button>
        </div>
        <div id="pinMap"></div>
        <div class="map-crosshair"></div>
        <div class="map-crosshair-dot"></div>
      </div>
      <div class="campus-note" id="campusNote" style="display:none">Map locked to IITGN campus · zoom in to place pin precisely</div>

      <div class="fg" style="margin-top:10px">
        <label class="required" for="zone">Campus Area</label>
        <select id="zone" name="zone" required>
          <option value="" selected disabled>Select Campus Area</option>
          {% for value, label in campus_areas %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Measurements -->
    <div class="card">
      <div class="sec-title">Measurements</div>
      <div class="row2">
      <div class="fg">
        <label class="required" for="height_m">Height (m)</label>
        <input type="number" id="height_m" name="height_m" step="0.01" min="0" required placeholder="e.g. 4.5">
      </div>

      <div class="fg">
        <label class="required" for="girth_cm">Girth (cm)</label>
        <input type="number" id="girth_cm" name="girth_cm" step="0.1" min="0" required placeholder="e.g. 85">
      </div>
    </div>

    <div class="fg" style="margin-top:10px">
      <label class="required" for="canopy_area_m">Canopy Span (m)</label>
      <input type="number" vid="canopy_area_m" name="canopy_area_m" step="0.01" min="0" required placeholder="e.g. 3.2">
    </div>
    </div>

    <!-- Condition -->
    <div class="card">
      <div class="sec-title">Condition</div>
      <div class="fg">
        <label for="condition">Overall Condition</label>
        <select id="condition" name="condition">
          <option value="excellent">Excellent</option>
          <option value="good" selected>Good</option>
          <option value="fair">Fair</option>
          <option value="poor">Poor</option>
          <option value="dead">Dead</option>
        </select>
      </div>
      <div class="fg">
        <label for="notes">Additional Notes</label>
        <textarea id="notes" name="notes" placeholder="Any diseases, damage, special features…"></textarea>
      </div>
    </div>

    <!-- Photo -->
    <div class="card">
      <div class="sec-title">Photo</div>
      <div class="fg">
        <label for="photo">Capture / Upload Photo</label>
        <input type="file" id="photo" name="photo" accept="image/*" capture="environment" required>
        <img id="photoPreview" class="photo-preview" alt="Preview">
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      <span id="submitIcon">🌿</span>
      <span id="submitText">Submit Record</span>
    </button>
  </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Variety select ────────────────────────────────────────────────────────
var varietySelect = document.getElementById('variety');
var plantTypeInput = document.getElementById('plant_type');

function syncVarietyOptions() {
  var selectedRadio = document.querySelector(
    'input[name="plant_type_display"]:checked'
  );

  var selectedType = selectedRadio ? selectedRadio.value : '';

  Array.prototype.forEach.call(varietySelect.options, function(o) {
    if (!o.value) return;

    var optionType = o.getAttribute('data-type');

    o.hidden = selectedType
      ? optionType !== selectedType
      : false;
  });
}
varietySelect.addEventListener('change', function() {
  var sel = this.options[this.selectedIndex];
  if (!sel) return;
  var type = sel.getAttribute('data-type');
  var name = sel.getAttribute('data-name');
  var sci  = sel.getAttribute('data-scientific');
  if (type) {
    plantTypeInput.value = type;
    var r = document.querySelector('input[type="radio"][name="plant_type_display"][value="'+type+'"]');
    if (r) {
      r.checked = true;
      syncVarietyOptions();
    }
  }
  if (name) document.getElementById('local_name').value = name;
  if (sci)  document.getElementById('scientific_name').value = sci;
  syncVarietyOptions();
});
document.querySelectorAll('input[name="plant_type_display"]')
  .forEach(function(radio) {
    radio.addEventListener('change', function() {

      plantTypeInput.value = this.value;

      varietySelect.selectedIndex = 0;

      document.getElementById('scientific_name').value = '';
      document.getElementById('local_name').value = '';

      syncVarietyOptions();
    });
  });
syncVarietyOptions();

// ── GPS Averaging Engine ──────────────────────────────────────────────────
// Priority: accuracy and stability over speed.
// Strategy:
//   1. Reject any reading worse than GPS_REJECT_M (too noisy to use).
//   2. Collect at least GPS_MIN_SAMPLES before considering any commit.
//   3. Once accuracy ≤ GPS_TARGET_M is first reached, do NOT stop —
//      continue gathering for GPS_REFINE_EXTRA_MS more to further stabilise.
//   4. Keep collecting until GPS_OBSERVATION_MS has elapsed (≥30 s window),
//      then commit the best weighted average accumulated so far.
//   5. Hard ceiling: GPS_HARD_TIMEOUT_MS — gives up only if no fix at all.

var GPS_TARGET_M        = 5;    // desired accuracy threshold (metres)
var GPS_REJECT_M        = 20;   // discard readings coarser than this
var GPS_MIN_SAMPLES     = 5;    // minimum readings before any commit
var GPS_OBSERVATION_MS  = 30000; // collect for at least this long (30 s)
var GPS_REFINE_EXTRA_MS = 8000;  // keep going this long after first hitting target
var GPS_HARD_TIMEOUT_MS = 75000; // absolute give-up deadline

var gpsWatcher     = null;
var gpsSamples     = [];
var gpsTimer       = null;
var gpsRefineTimer = null;
var gpsActive      = false;
var gpsTargetHit   = false;  // true once accuracy ≤ GPS_TARGET_M first reached
var gpsStartTime   = 0;

function gpsAccClass(m) {
  return m <= GPS_TARGET_M ? 'great' : m <= 12 ? 'ok' : 'poor';
}
function gpsBarPct(m) {
  return Math.max(0, Math.min(100, ((GPS_REJECT_M - m) / GPS_REJECT_M) * 100));
}
function updateAccUI(accuracyM, sampleCount, totalSeen, method) {
  var cls = method === 'map' ? 'map' : gpsAccClass(accuracyM);
  document.getElementById('accBarWrap').style.display = 'block';
  document.getElementById('accBadge').style.display   = 'inline-block';
  document.getElementById('accBarFill').style.width   = (method === 'map' ? 92 : gpsBarPct(accuracyM)) + '%';
  document.getElementById('accBarFill').className     = 'acc-bar-fill ' + cls;
  document.getElementById('accBarText').textContent   = method === 'map' ? 'Pin placed' : '±' + accuracyM.toFixed(1) + ' m';
  document.getElementById('accBarLabel').textContent  = method === 'map' ? 'Map pin' : 'Accuracy';
  document.getElementById('accBadge').className       = 'acc-badge ' + cls;
  document.getElementById('accBadge').textContent     = method === 'map' ? '📍 Map pin' : '±' + accuracyM.toFixed(1) + ' m';
  if (sampleCount !== null) {
    document.getElementById('accSamples').textContent = sampleCount + ' good readings' +
      (totalSeen > sampleCount ? ' (' + (totalSeen - sampleCount) + ' rejected)' : '');
  } else {
    document.getElementById('accSamples').textContent = 'Position set by map pin';
  }
}
function computeAvg(samples) {
  var totalW = 0, lat = 0, lng = 0, acc = 0;
  for (var i = 0; i < samples.length; i++) {
    var w = 1 / (samples[i].accuracy * samples[i].accuracy);
    lat += samples[i].lat * w;
    lng += samples[i].lng * w;
    acc += samples[i].accuracy * w;
    totalW += w;
  }
  return { lat: lat / totalW, lng: lng / totalW, accuracy: acc / totalW };
}
function commitFix(avg, method) {
  document.getElementById('latitude').value  = avg.lat.toFixed(7);
  document.getElementById('longitude').value = avg.lng.toFixed(7);
  var h = document.getElementById('gps_accuracy_m');
  if (h) h.value = method === 'map' ? 'map_pin' : avg.accuracy.toFixed(2);
}
function stopGps() {
  if (gpsWatcher !== null)     { navigator.geolocation.clearWatch(gpsWatcher); gpsWatcher = null; }
  if (gpsTimer !== null)       { clearTimeout(gpsTimer); gpsTimer = null; }
  if (gpsRefineTimer !== null) { clearTimeout(gpsRefineTimer); gpsRefineTimer = null; }
  gpsActive      = false;
  gpsTargetHit   = false;
  var btn = document.getElementById('gpsBtn');
  btn.disabled = false;
  btn.textContent = '📍 GPS';
}

// Called when the observation window has elapsed (or hard timeout fires).
// Commits the best average from all good samples collected so far.
function finaliseGps(timedOut) {
  var status = document.getElementById('gpsStatus');
  if (gpsSamples.length >= GPS_MIN_SAMPLES) {
    var avg = computeAvg(gpsSamples);
    commitFix(avg, 'gps');
    updateAccUI(avg.accuracy, gpsSamples.length, gpsSamples._totalSeen || gpsSamples.length, 'gps');
    var cls = gpsAccClass(avg.accuracy);
    if (cls === 'great') {
      status.textContent = '✓ Location locked — ±' + avg.accuracy.toFixed(1) + ' m (' + gpsSamples.length + ' readings)';
      status.className = 'gps-status ok';
    } else if (timedOut) {
      status.textContent = '⚠ Timed out — best ±' + avg.accuracy.toFixed(1) + ' m. Use Map pin for better accuracy.';
      status.className = 'gps-status warn';
    } else {
      status.textContent = '⚠ Best achieved: ±' + avg.accuracy.toFixed(1) + ' m. Use Map pin for higher accuracy.';
      status.className = 'gps-status warn';
    }
  } else {
    status.textContent = '✗ Could not get a reliable fix. Try the Map pin instead.';
    status.className = 'gps-status err';
  }
  stopGps();
}

function startGps() {
  var status = document.getElementById('gpsStatus');
  if (!navigator.geolocation) {
    status.textContent = 'Geolocation not supported.';
    status.className = 'gps-status err';
    return;
  }
  if (gpsActive) stopGps();

  gpsActive    = true;
  gpsTargetHit = false;
  gpsStartTime = Date.now();
  gpsSamples   = [];
  gpsSamples._totalSeen = 0;

  var btn = document.getElementById('gpsBtn');
  btn.disabled    = true;
  btn.textContent = '⏳ …';
  status.textContent = 'Acquiring GPS fix — hold phone flat under open sky…';
  status.className   = 'gps-status';
  document.getElementById('accBarWrap').style.display = 'none';
  document.getElementById('accBadge').style.display   = 'none';

  // Hard timeout: give up entirely after GPS_HARD_TIMEOUT_MS
  gpsTimer = setTimeout(function () { finaliseGps(true); }, GPS_HARD_TIMEOUT_MS);

  gpsWatcher = navigator.geolocation.watchPosition(
    function (pos) {
      if (!gpsActive) return;

      gpsSamples._totalSeen = (gpsSamples._totalSeen || 0) + 1;
      var acc = pos.coords.accuracy;

      // Discard readings that are too coarse to be useful
      if (acc > GPS_REJECT_M) {
        status.textContent = 'Waiting for clear signal… (±' + Math.round(acc) + ' m — move to open sky)';
        status.className = 'gps-status warn';
        return;
      }

      gpsSamples.push({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: acc });

      // Dynamic outlier rejection once we have a rough centre estimate
      if (gpsSamples.length >= 3) {
        var rough = computeAvg(gpsSamples);
        var dist = Math.sqrt(
          Math.pow((pos.coords.latitude  - rough.lat) * 111320, 2) +
          Math.pow((pos.coords.longitude - rough.lng) * 111320 * Math.cos(rough.lat * Math.PI / 180), 2)
        );
        if (dist > 8) { gpsSamples.pop(); return; }  // geometric outlier — discard
      }

      var avg = computeAvg(gpsSamples);
      var elapsed = Date.now() - gpsStartTime;

      // Always publish the live running average to the form fields
      document.getElementById('latitude').value  = avg.lat.toFixed(7);
      document.getElementById('longitude').value = avg.lng.toFixed(7);
      updateAccUI(avg.accuracy, gpsSamples.length, gpsSamples._totalSeen, 'gps');

      // ── Phase labels ────────────────────────────────────────────────────
      if (gpsSamples.length < GPS_MIN_SAMPLES) {
        // Still building the minimum sample set
        status.textContent = 'Collecting… (' + gpsSamples.length + '/' + GPS_MIN_SAMPLES +
          ', ±' + avg.accuracy.toFixed(1) + ' m)';
        status.className = 'gps-status';
        return;
      }

      var remaining = Math.max(0, Math.ceil((GPS_OBSERVATION_MS - elapsed) / 1000));

      if (avg.accuracy <= GPS_TARGET_M) {
        // Target accuracy reached — keep going to stabilise the estimate
        if (!gpsTargetHit) {
          // First time crossing the threshold: schedule the extra refinement window
          gpsTargetHit = true;
          if (gpsRefineTimer === null) {
            gpsRefineTimer = setTimeout(function () {
              // Observation window complete — commit final, stabilised fix
              finaliseGps(false);
            }, Math.max(GPS_REFINE_EXTRA_MS, GPS_OBSERVATION_MS - elapsed));
          }
        }
        status.textContent = 'Stabilising… ±' + avg.accuracy.toFixed(1) + ' m' +
          (remaining > 0 ? ' (' + remaining + ' s remaining)' : '') +
          ' — ' + gpsSamples.length + ' readings';
        status.className = 'gps-status ok';
      } else {
        // Still above target — keep collecting; commit via observation window timer
        status.textContent = 'Refining… (' + gpsSamples.length + ' readings, ±' + avg.accuracy.toFixed(1) + ' m' +
          (remaining > 0 ? ', ' + remaining + ' s left' : '') + ')';
        status.className = 'gps-status ok';

        // Start the observation window timer on first qualifying sample if not yet started
        if (gpsRefineTimer === null && elapsed < GPS_OBSERVATION_MS) {
          var waitMs = GPS_OBSERVATION_MS - elapsed;
          gpsRefineTimer = setTimeout(function () { finaliseGps(false); }, waitMs);
        } else if (gpsRefineTimer === null) {
          // Already past the observation window without hitting target — commit now
          finaliseGps(false);
        }
      }
    },
    function (err) {
      var msg = err.code === 1
        ? 'Location permission denied.'
        : err.code === 2
          ? 'GPS unavailable.'
          : 'GPS timed out.';
      document.getElementById('gpsStatus').textContent = '✗ ' + msg;
      document.getElementById('gpsStatus').className   = 'gps-status err';
      stopGps();
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
  );
}
document.getElementById('gpsBtn').addEventListener('click', startGps);
startGps();

// ── Map Pin Picker ────────────────────────────────────────────────────────
// IITGN campus bounding box (slightly padded so user can't scroll away)
var CAMPUS_BOUNDS = L.latLngBounds(
  L.latLng(23.2082, 72.6812),   // SW corner
  L.latLng(23.2188, 72.6928)    // NE corner
);
var CAMPUS_CENTER = [23.2135, 72.6870];

var leafletMap  = null;
var mapOpen     = false;
var mapPinLat   = null;
var mapPinLng   = null;

function initMap() {
  if (leafletMap) return;  // already initialised

  leafletMap = L.map('pinMap', {
    center:         CAMPUS_CENTER,
    zoom:           18,
    minZoom:        17,       // prevent zooming out beyond campus
    maxZoom:        19,
    maxBounds:      CAMPUS_BOUNDS,
    maxBoundsViscosity: 1.0,  // hard wall — can't pan outside
    zoomControl:    true,
    attributionControl: true
  });

  // OpenStreetMap standard tiles — free, no API key
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(leafletMap);

  // Faint campus boundary rectangle so user knows the allowed area
  L.rectangle(CAMPUS_BOUNDS, {
    color: '#0e6b94', weight: 2, fill: false, dashArray: '6 4', opacity: 0.5
  }).addTo(leafletMap);

  // The map uses a crosshair overlay (CSS) — centre of map = pin position.
  // No draggable marker needed; user pans the map instead (easier on mobile).
  leafletMap.on('moveend', function() {
    var c = leafletMap.getCenter();
    mapPinLat = c.lat;
    mapPinLng = c.lng;
    // Live-update fields so user can see coordinates changing
    document.getElementById('latitude').value  = c.lat.toFixed(7);
    document.getElementById('longitude').value = c.lng.toFixed(7);
  });

  // If GPS already got a fix, centre the map there; else use campus centre
  var existingLat = parseFloat(document.getElementById('latitude').value);
  var existingLng = parseFloat(document.getElementById('longitude').value);
  if (!isNaN(existingLat) && !isNaN(existingLng)
      && CAMPUS_BOUNDS.contains([existingLat, existingLng])) {
    leafletMap.setView([existingLat, existingLng], 19);
  }
}

document.getElementById('mapBtn').addEventListener('click', function() {
  var picker = document.getElementById('mapPicker');
  var note   = document.getElementById('campusNote');
  if (mapOpen) {
    picker.classList.remove('open');
    note.style.display = 'none';
    mapOpen = false;
    this.textContent = '🗺 Map';
  } else {
    picker.classList.add('open');
    note.style.display = 'block';
    mapOpen = true;
    this.textContent = '✕ Close map';
    // Initialise Leaflet lazily (only when first opened)
    setTimeout(function() {
      initMap();
      if (leafletMap) leafletMap.invalidateSize();
    }, 50);
  }
});

document.getElementById('mapConfirmBtn').addEventListener('click', function() {
  if (!leafletMap) return;
  var c = leafletMap.getCenter();
  mapPinLat = c.lat;
  mapPinLng = c.lng;

  document.getElementById('latitude').value  = c.lat.toFixed(7);
  document.getElementById('longitude').value = c.lng.toFixed(7);
  document.getElementById('gps_accuracy_m').value = 'map_pin';

  // Update accuracy UI to show map-pin method
  updateAccUI(0, null, null, 'map');
  document.getElementById('gpsStatus').textContent = '✓ Position set from map pin — pan map to adjust';
  document.getElementById('gpsStatus').className   = 'gps-status ok';

  // Close map
  document.getElementById('mapPicker').classList.remove('open');
  document.getElementById('campusNote').style.display = 'none';
  document.getElementById('mapBtn').textContent = '🗺 Map';
  mapOpen = false;
});

// ── Photo preview ─────────────────────────────────────────────────────────
document.getElementById('photo').addEventListener('change', function(e) {
  var file    = e.target.files[0];
  var preview = document.getElementById('photoPreview');
  if (file) { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
  else      { preview.style.display = 'none'; }
});

// ── Form submit ───────────────────────────────────────────────────────────
document.getElementById('plantForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn  = document.getElementById('submitBtn');
  var icon = document.getElementById('submitIcon');
  var text = document.getElementById('submitText');
  btn.disabled = true; icon.textContent = '⏳'; text.textContent = 'Submitting…';

  var formData = new FormData(this);
  fetch('/geo/submit/record/', {
    method: 'POST', body: formData,
    headers: { 'X-CSRFToken': formData.get('csrfmiddlewaretoken') },
  })
  .then(function(res){ return res.json(); })
  .then(function(data) {
    if (data.success) {
      showFlash('✓ Record submitted successfully! (ID: ' + data.id + ')', 'ok');
      document.getElementById('plantForm').reset();
      plantTypeInput.value = '';
      syncVarietyOptions();
      document.getElementById('photoPreview').style.display = 'none';
      document.getElementById('gpsStatus').textContent = '';
      document.getElementById('accBarWrap').style.display = 'none';
      document.getElementById('accBadge').style.display   = 'none';
      // Close map if open
      if (mapOpen) {
        document.getElementById('mapPicker').classList.remove('open');
        document.getElementById('campusNote').style.display = 'none';
        document.getElementById('mapBtn').textContent = '🗺 Map';
        mapOpen = false;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      var errs = data.errors
        ? Object.values(data.errors).flat().join(' ')
        : 'Submission failed. Please check your inputs.';
      showFlash('✗ ' + errs, 'err');
    }
    btn.disabled = false; icon.textContent = '🌿'; text.textContent = 'Submit Record';
  })
  .catch(function() {
    showFlash('✗ Network error. Please try again.', 'err');
    btn.disabled = false; icon.textContent = '🌿'; text.textContent = 'Submit Record';
  });
});

function showFlash(msg, type) {
  var area = document.getElementById('flash-area');
  area.innerHTML = '<div class="flash ' + type + '">' + msg + '</div>';
  area.scrollIntoView({ behavior: 'smooth' });
  if (type === 'ok') setTimeout(function(){ area.innerHTML = ''; }, 6000);
}
</script>
</body>
