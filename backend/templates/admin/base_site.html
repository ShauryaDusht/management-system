{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link rel="icon" type="image/png" href="{% static 'branding/campus-sanchalika-logo.png' %}">
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  #header {
    background: linear-gradient(135deg, #17382f, #2d4a3e);
  }

  #branding {
    display: flex;
    align-items: center;
  }

  #site-name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
  }

  #site-name img {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.96);
    padding: 2px;
  }

  #site-name .brand-copy {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  #site-name .brand-copy small {
    font-size: 11px;
    opacity: 0.78;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  #site-name .brand-copy strong {
    font-size: 20px;
    font-weight: 700;
  }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'restricted_admin:index' %}" style="display:flex;align-items:center;gap:12px;color:inherit">
    <img src="{% static 'branding/campus-sanchalika-logo.png' %}" alt="Campus Sanchalika">
    <span class="brand-copy">
      <small>IITGN Campus Operations</small>
      <strong>Campus Sanchalika</strong>
    </span>
  </a>
</div>
{% endblock %}
