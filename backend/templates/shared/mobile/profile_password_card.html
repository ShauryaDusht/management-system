<div class="card" style="background:rgba(255,255,255,.93)">
  <div style="font-weight:700;color:#2d4a3e;margin-bottom:12px">Change Password</div>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="change_password">
    <div class="fg"><label>Current Password</label><input type="password" name="current_password" required></div>
    <div class="fg"><label>New Password (min 8 chars)</label><input type="password" name="new_password" required></div>
    <div class="fg"><label>Confirm Password</label><input type="password" name="confirm_password" required></div>
    <button type="submit" class="btn-s" style="background:#2d4a3e">Update Password</button>
  </form>
</div>
