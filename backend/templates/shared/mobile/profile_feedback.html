{% if success %}
<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:10px;padding:11px;margin-bottom:12px;color:#065f46;font-weight:700">{{ success }}</div>
{% endif %}
{% if error %}
<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:11px;margin-bottom:12px;color:#991b1b;font-weight:700">{{ error }}</div>
{% endif %}
