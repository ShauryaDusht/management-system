<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline | Campus Sanchalika</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#efece4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#1f2937}
.logo{width:64px;height:64px;border-radius:16px;background:#fff;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.12);margin-bottom:20px}
h1{font-size:20px;font-weight:800;color:#29543a;margin-bottom:8px}
p{font-size:14px;color:#6b7280;text-align:center;max-width:280px;line-height:1.6;margin-bottom:24px}
.btn{background:#29543a;color:#fff;border:none;border-radius:12px;padding:13px 32px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<img class="logo" src="/campus-sanchalika-logo.png" alt="Campus Sanchalika">
<h1>You're offline</h1>
<p>No internet connection. Please check your connection and try again.</p>
<button class="btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
