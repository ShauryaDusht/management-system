# ============================================================
# Host-machine nginx config for campussanchalika.iitgn.ac.in
# Deploy to: /etc/nginx/sites-available/campussanchalika
# Symlink:   /etc/nginx/sites-enabled/campussanchalika
# SSL certs are managed on the host directly.
# ============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: redirect everything to HTTPS ──────────────────────
server {
    listen 80;
    server_name campussanchalika.iitgn.ac.in;

    # Allow CA cert download over plain HTTP
    location = /ca.crt {
        alias /etc/nginx/certs/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="IITGN-CA.crt"';
    }

    # Allow setup endpoint over plain HTTP
    location /setup/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name campussanchalika.iitgn.ac.in;

    # SSL — IITGN certificates on host
    ssl_certificate     /etc/nginx/certs/iitgn.crt;
    ssl_certificate_key /etc/nginx/certs/iitgn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml application/xml;
    gzip_min_length 1000;

    # ── CA cert download ──────────────────────────────────────
    location = /ca.crt {
        alias /etc/nginx/certs/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="IITGN-CA.crt"';
    }

    # ── Django static files (collected via manage.py collectstatic) ──
    location = /campus-sanchalika-logo.png {
        proxy_pass         http://127.0.0.1:5173/campus-sanchalika-logo.png;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /campus-sanchalika-logo.svg {
        proxy_pass         http://127.0.0.1:5173/campus-sanchalika-logo.svg;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /srv/campussanchalika/staticfiles/;
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Django media files ───────────────────────────────────
    location /media/ {
        alias /srv/campussanchalika/media/;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
        }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Admin React SPA ──────────────────────────────────────
    # All /admin/* requests go to the frontend-admin container.
    # The container serves the built Vite output via `serve`.
    # `serve --single` handles SPA fallback (all unknown paths
    # return index.html so React Router can take over).
    location /admin/ {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # WebSocket support (Vite HMR — dev only, harmless in prod)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    # Redirect bare /admin to /admin/
    location = /admin {
        return 308 /admin/;
    }

    # ── Auth API (stricter rate limit) ───────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── General API ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── All other Django routes (portal, manage, housekeeping, etc.) ──
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
