# Rate-limit zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

gzip on;
gzip_types text/plain application/json application/javascript text/css;
gzip_min_length 1000;

ssl_certificate     /etc/nginx/certs/local.crt;
ssl_certificate_key /etc/nginx/certs/local.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Admin dashboard - React app (Vite)
server {
    listen 5173;
    server_name _;

    location = /ca.crt {
        alias /etc/nginx/certs/ca.crt;
        types { }
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="IITGN-CA.crt"';
    }

    location / {
        return 308 https://$host:9443$request_uri;
    }
}

server {
    listen 9443 ssl;
    server_name _;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /@vite/ {
        proxy_pass         http://frontend-admin:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location / {
        proxy_pass         http://frontend-admin:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# Backend - Django/Gunicorn: portal login, mobile apps, API, admin panel
server {
    listen 8000;
    server_name _;

    location = /ca.crt {
        alias /etc/nginx/certs/ca.crt;
        types { }
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="IITGN-CA.crt"';
    }

    location /setup/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host:8000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $host:8000;
        proxy_set_header   X-Forwarded-Proto http;
    }

    location / {
        return 308 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    client_max_body_size 20M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $host:8443;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $host:8443;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /manage/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $host:8443;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /portal/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
