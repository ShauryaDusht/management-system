# ─────────────────────────────────────────────
#  Rate-limit zones  (defined outside `server`)
# ─────────────────────────────────────────────
# 10 req/s per IP for API routes — 10 MB of memory for tracking IPs
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 5 req/s per IP for auth routes (login/token) — tighter limit
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;


# ─────────────────────────────────────────────
#  Gzip compression
# ─────────────────────────────────────────────
gzip on;
gzip_types text/plain application/json application/javascript text/css;
gzip_min_length 1000;
# ─────────────────────────────────────────────
#  Server block
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;  # maximum file upload size

    # ── Static files (Django collectstatic output) ──────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Media files (user uploads) ──────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Auth endpoints — strict rate limit ─────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── All other API endpoints ─────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django admin ────────────────────────────────────────────────
    location /manage/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Housekeeping portal (HTMX/Django-rendered pages) ───────────
    location /housekeeping/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── React frontend (Vite dev server) ────────────────────────────
    #    Nginx forwards all other traffic to the Vite dev server.
    #    HMR (hot-reload) websocket is handled separately below.
    location / {
        proxy_pass         http://frontend-admin:5173;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # ── Vite HMR websocket ──────────────────────────────────────────
    location /@vite/ {
        proxy_pass         http://frontend-admin:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}