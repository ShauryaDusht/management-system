services:

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file:
      - .env
    environment:
      DB_HOST: db
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: bash /app/scripts/start_backend.sh

  frontend-admin:
    build: ./frontend-admin
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend-admin/src:/app/src
    expose:
      - "5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "5173:5173"                         # HTTP redirect for React admin dashboard
      - "9443:9443"                         # HTTPS React admin dashboard
      - "8000:8000"                         # HTTP redirect for Django portal/API/mobile apps
      - "8443:8443"                         # HTTPS Django portal/API/mobile apps
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_files:/app/staticfiles:ro   # serve Django static files directly
      - media_files:/app/media:ro          # serve media files directly
    depends_on:
      - backend
      - frontend-admin

volumes:
  postgres_data:
  media_files:
  static_files:                            # new shared volume for static files
