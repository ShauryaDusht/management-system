  frontend-admin:
    build: ./frontend-admin
    restart: always
    volumes:
      - ./frontend-admin/src:/app/src
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  media_files:
