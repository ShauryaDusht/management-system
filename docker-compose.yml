services:

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /srv/campussanchalika/media:/app/media
      - /srv/campussanchalika/staticfiles:/app/staticfiles
      - /srv/campussanchalika/backups:/app/backups
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: bash /app/scripts/start_backend.sh

  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_URL: ${VITE_API_URL:-https://campussanchalika.iitgn.ac.in/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
